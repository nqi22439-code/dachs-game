  html, body {
    margin: 0; padding: 0; height: 100%;

    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #wrap { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
  #stage { position: relative; line-height: 0; width: min(96vw, 150vh); }
  canvas {
    display: block; width: 100%; height: auto;
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #7ec8f2;
    border: 4px solid #2a2018; border-radius: 6px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  }
  #hint { color:#8f9bb3; font-size:13px; letter-spacing:1px; text-align:center; padding:0 10px; }
  #hint b { color:#ffcb05; }

  /* ---------------- スマホ用タッチ操作 ---------------- */
  #touch, #backBtn, #rotate { display: none; }
  body.touch #touch { display: flex; }
  body.touch #backBtn { display: block; }
  body.touch #hint { display: none; }
  body.touch #stage { width: min(100vw, 152vh); }

  #touch {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    justify-content: space-between; align-items: flex-end;
    pointer-events: none;
  }
  #touch .group { display: flex; gap: 14px; align-items: flex-end; pointer-events: auto; }
  #touch button {
    -webkit-appearance: none; appearance: none;
    width: 68px; height: 68px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.45);
    background: rgba(30,28,38,0.55);
    color: #fff; font-size: 26px; font-weight: bold;
    font-family: inherit; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  #touch button.jump {
    width: 92px; height: 92px; font-size: 15px;
    background: rgba(76,170,100,0.5); border-color: rgba(180,255,200,0.65);
  }
  #touch button.down { width: 56px; height: 56px; font-size: 20px; }
  #touch button.on { background: rgba(255,203,5,0.6); border-color: #ffcb05; color: #2a2018; }
  #backBtn {
    position: fixed; top: 8px; right: 10px; z-index: 11;
    -webkit-appearance: none; appearance: none;
    padding: 9px 15px; border-radius: 14px; font-family: inherit;

const SAVE_KEY = 'dachs-sancha-progress';
const blank9 = v => Array.from({ length: TOTAL_STAGES }, () => v);
let save = { cleared:blank9(false), perfect:blank9(false), times:blank9(0),
             hiddenFound:false, hiddenCleared:false, hiddenPerfect:false,
             best:0, seenOpening:false, seenEnding:false,
             totalJerky:0, secretsFound:0, powerKills:0,
             usedPowers:{}, badges:{}, ghosts:{} };
try {
  const raw = localStorage.getItem(SAVE_KEY);
  if (raw) {
    const old = JSON.parse(raw);
    // ステージ数が変わった古いセーブは進行状況だけ捨てる
    if (!Array.isArray(old.cleared) || old.cleared.length !== TOTAL_STAGES) {
      delete old.cleared; delete old.perfect; delete old.times;
    }
    save = Object.assign(save, old);
    save.usedPowers = save.usedPowers || {}; save.badges = save.badges || {}; save.ghosts = save.ghosts || {};
  }
} catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
const stageUnlocked = i => i === 0 || save.cleared[i - 1];
const clearedCount = () => save.cleared.filter(Boolean).length;
const perfectCount = () => save.perfect.filter(Boolean).length;
function fmtTime(f) {
  if (!f) return '--:--';
  const s = f / 60;
  return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
}

// ================================================================= レベル読込
let LEVEL = [], COLS = 0, LEVEL_W = 0, TH = THEMES.day, curStage = null, curIndex = 0;

function tileAt(col, row) {
  if (row < 0 || row >= ROWS) return '.';
  if (col < 0) return '#';
  if (col >= COLS) return '.';
  return LEVEL[row][col];
}
const isBlock = ch => ch === '#' || ch === 'B' || ch === 'H' || ch === 'O';

// ================================================================= 描画補助
function R(x, y, w, h, color, s, ox, oy) {
  ctx.fillStyle = color;
  ctx.fillRect(ox + x * s, oy + y * s, w * s, h * s);
}

// ------------------------------ 主人公：白いダックスフンドのフォル（26x16）
// legEx: ばねの足で伸びる脚の長さ（スプライト単位）
function drawDog(ox, oy, s, frame, hurtFlash, rainbow, legEx = 0) {
  const P = (x, y, w, h, c) => R(x, y, w, h, c, s, ox, oy);
  const D = hurtFlash ? '#ffffff' : C.dark;
  const hu = (tick * 7) % 360;
  const body   = rainbow ? 'hsl(' + hu + ',100%,90%)' : C.cream;
  const bodyL  = rainbow ? 'hsl(' + hu + ',100%,96%)' : C.creamL;
  const bodyD  = rainbow ? 'hsl(' + hu + ',60%,78%)'  : C.creamD;
  const shirt  = rainbow ? 'hsl(' + ((hu + 140) % 360) + ',95%,62%)' : C.shirt;
  const shirtD = rainbow ? 'hsl(' + ((hu + 140) % 360) + ',95%,46%)' : C.shirtD;
  const earC   = rainbow ? 'hsl(' + hu + ',70%,82%)' : C.ear;
  const earL   = rainbow ? 'hsl(' + hu + ',70%,90%)' : C.earL;

  P(0, 3, 5, 4, D);
  P(2, 5, 17, 9, D);
  P(15, 0, 10, 10, D);
  P(22, 3, 4, 7, D);
  const legA = frame === 0 ? [4, 13] : [3, 14];
  P(legA[0], 12, 4, 4 + legEx, D);
  P(legA[1], 12, 4, 4 + legEx, D);

  P(1, 4, 3, 2, bodyL);
  P(3, 6, 15, 7, body);
  P(16, 1, 8, 8, body);
  P(23, 4, 3, 4, bodyL);
  P(24, 4, 2, 2, C.nose);
  P(23, 8, 2, 1, C.pink);
  P(20, 3, 2, 2, C.nose);
  P(21, 3, 1, 1, C.white);
  P(20, 5, 2, 1, bodyD);

  P(3, 6, 12, 7, shirt);
  P(3, 12, 12, 1, shirtD);
  P(9, 7, 1, 5, C.white);
  P(11, 7, 1, 5, C.white);
  P(13, 7, 1, 5, C.white);
  P(6, 7, 1, 2, C.white);
  P(8, 7, 1, 2, C.white);
  P(7, 7, 1, 1, C.white);
  P(7, 9, 1, 1, C.white);

  P(15, 2, 5, 2, D);
  P(14, 3, 6, 7, D);
  P(15, 10, 5, 1, D);
  P(16, 3, 3, 1, earL);
  P(15, 4, 4, 5, earC);
  P(16, 9, 3, 1, earC);

  P(legA[0] + 1, 12, 2, 3 + legEx, body);
  P(legA[1] + 1, 12, 2, 3 + legEx, body);
}

// ------------------------------------------------ ヒゲおじさん（16x20）
function drawStache(ox, oy, s, frame, squashed) {
  const P = (x, y, w, h, c) => R(x, y, w, h, c, s, ox, oy);
  if (squashed) {
    P(1, 15, 14, 5, C.dark);
    P(2, 16, 12, 3, C.coat);
    P(4, 14, 8, 2, C.skin);
    P(4, 14, 8, 1, C.stache);
    return;
  }
  P(1, 0, 14, 4, C.dark);
  P(2, 1, 12, 3, C.hat);
  P(0, 4, 16, 2, C.dark);
  P(0, 4, 16, 1, C.hat);
  P(2, 6, 12, 7, C.dark);
  P(3, 6, 10, 6, C.skin);
  P(3, 11, 10, 1, C.skinD);
  P(4, 7, 2, 2, C.nose);
  P(10, 7, 2, 2, C.nose);
  P(2, 9, 12, 2, C.stache);
  P(1, 10, 2, 2, C.stache);
  P(13, 10, 2, 2, C.stache);
  P(1, 12, 14, 7, C.dark);
  P(2, 13, 12, 5, C.coat);
  P(2, 16, 12, 2, C.coatD);
  P(7, 13, 2, 5, C.coatD);
  const sw = frame === 0 ? 0 : 1;
  P(0 + sw, 13, 2, 5, C.coat);
  P(14 - sw, 13, 2, 5, C.coat);
  P(3 + sw, 18, 4, 2, C.dark);
  P(9 - sw, 18, 4, 2, C.dark);
}

// ------------------- 第2エリアの敵：スーツのヒゲ男（16x20・足が速い）
function drawSuit(ox, oy, s, frame, squashed) {

  P(3, 3, 10, 1, C.suitHair);
  P(2, 4, 12, 8, D);                       // 顔
  P(3, 4, 10, 7, C.skin);
  P(3, 10, 10, 1, C.skinD);
  P(4, 6, 2, 2, C.nose);                   // 細い目
  P(10, 6, 2, 2, C.nose);
  P(3, 8, 10, 2, C.stache);                // 口ヒゲ
  P(2, 9, 1, 1, C.stache); P(13, 9, 1, 1, C.stache);
  P(1, 11, 14, 7, D);                      // スーツ
  P(2, 12, 12, 5, C.suit);
  P(2, 15, 12, 2, C.suitD);
  P(6, 12, 4, 5, C.white);                 // シャツ

  P(14 - sw, 14, 2, 1, C.case1);
  P(3 + sw, 18, 4, 2, D);
  P(9 - sw, 18, 4, 2, D);
}

// -------------------- ボス：モジャモジャのロン毛で小太りのヒゲ面おじさん（28x30）
function drawBoss(ox, oy, s, frame, flash, defeated, drunk) {
  const P = (x, y, w, h, c) => R(x, y, w, h, c, s, ox, oy);
  const F = flash ? '#ffffff' : null;
  const col = c => F || c;
  const D = C.dark;

  if (defeated) {
    P(2, 22, 24, 8, D);                      // つぶれて座り込む
    P(3, 23, 22, 6, col(C.bossCoat));
    P(1, 19, 26, 4, D);                      // 広がったモジャ髪
    P(2, 19, 24, 3, col(C.bossHair));
    P(9, 17, 10, 5, D);
    P(10, 18, 8, 2, col(C.skin));
    P(10, 20, 8, 2, C.bossStache);
    return;
  }

  const sw = frame === 0 ? 0 : 1;

  // ===== モジャモジャのロン毛（ギザギザのシルエット）
  P(8, 0, 2, 3, D); P(12, 0, 2, 2, D); P(16, 0, 2, 3, D); P(19, 1, 2, 2, D); P(6, 2, 2, 2, D);
  P(10, 1, 8, 2, D);
  P(7, 2, 14, 2, D);
  P(5, 3, 18, 3, D);
  P(4, 5, 20, 4, D);
  P(2, 8, 24, 9, D);                         // 横にふくらむ
  P(3, 16, 22, 4, D);
  P(2, 19, 8, 4, D);  P(18, 19, 8, 4, D);    // 毛先が左右にバラける
  P(3, 22, 5, 3, D);  P(20, 22, 5, 3, D);
  P(4, 24, 3, 2, D);  P(21, 24, 3, 2, D);

  P(11, 2, 6, 1, col(C.bossHairL));
  P(8, 3, 12, 2, col(C.bossHair));
  P(5, 5, 18, 4, col(C.bossHair));
  P(3, 9, 22, 7, col(C.bossHairD));
  P(4, 16, 20, 3, col(C.bossHairD));
  P(3, 20, 6, 3, col(C.bossHairD));
  P(19, 20, 6, 3, col(C.bossHairD));
  P(4, 6, 3, 6, col(C.bossHairL));           // 光の当たる面
  P(7, 10, 1, 8, col(C.bossHair));           // モジャ感を出す縦の筋
  P(20, 10, 1, 8, col(C.bossHair));
  P(5, 13, 1, 6, col(C.bossHair));
  P(22, 13, 1, 6, col(C.bossHair));

  // ===== からだ（小太り：樽型でお腹が出ている）
  P(5, 18, 18, 11, D);
  P(3, 21, 22, 7, D);                        // お腹のふくらみ
  P(6, 19, 16, 9, col(C.bossCoat));
  P(4, 22, 20, 5, col(C.bossCoat));
  P(4, 25, 20, 2, col(C.bossCoatD));
  P(6, 19, 16, 1, '#8d7fa8');                // 襟
  P(11, 20, 6, 8, col(C.bossShirt));         // はだけたシャツから腹がのぞく
  P(11, 25, 6, 3, col(C.bossShirtD));
  P(10, 20, 1, 8, col(C.bossCoatD));
  P(17, 20, 1, 8, col(C.bossCoatD));

  // ===== 腕（短くて太い）
  P(0 + sw, 19, 5, 8, D);
  P(1 + sw, 20, 3, 6, col(C.bossCoat));
  P(23 - sw, 19, 5, 8, D);
  P(24 - sw, 20, 3, 6, col(C.bossCoat));

  // ===== 足（短い）
  P(7 + sw, 28, 6, 2, D);
  P(15 - sw, 28, 6, 2, D);

  // ===== 顔（酔っぱらいは赤ら顔）
  P(8, 4, 12, 14, D);
  P(9, 5, 10, 12, col(drunk ? C.drunkFace : C.skin));
  P(9, 15, 10, 2, col(drunk ? C.drunkFaceD : C.skinD));
  if (drunk) { P(9, 10, 2, 2, C.drunkRed); P(17, 10, 2, 2, C.drunkRed); }
  P(8, 4, 12, 3, col(C.bossHair));           // 前髪
  P(13, 7, 2, 1, col(C.bossHair));

  P(9, 7, 4, 2, C.bossStache);               // 太い眉
  P(15, 7, 4, 2, C.bossStache);
  P(10, 9, 2, 2, C.nose);                    // 目
  P(16, 9, 2, 2, C.nose);
  P(10, 9, 1, 1, C.white);
  P(16, 9, 1, 1, C.white);
  P(12, 10, 4, 3, D);                        // 団子鼻
  P(12, 10, 4, 2, col(drunk ? C.drunkRed : C.skinD));

  // ===== ヒゲ面（口ヒゲとあごヒゲがつながってモジャモジャ）
  P(7, 12, 14, 8, D);
  P(8, 13, 12, 6, C.bossStache);
  P(10, 19, 8, 3, D);
  P(10, 19, 8, 2, C.bossStache);
  P(12, 14, 4, 1, '#5b3a2a');                // 口
  P(9, 12, 2, 2, col(drunk ? C.drunkFace : C.skin));   // ほおの肌を少し残す
  P(17, 12, 2, 2, col(drunk ? C.drunkFace : C.skin));

  // ===== 酔っぱらいの証：デカいジョッキと千鳥足の湯気
  if (drunk) {
    P(23 - sw, 12, 7, 8, D);
    P(24 - sw, 13, 5, 6, C.beer);
    P(24 - sw, 12, 5, 2, C.beerFoam);
    P(29 - sw, 14, 2, 4, D);
    P(2, 1, 2, 2, C.beerFoam);                        // ふわふわ
    P(24, 2, 2, 2, C.beerFoam);
  }
}

// -------------------- ラスボス：炎を吐くゴールデンレトリバー（30x30・左向き）
function drawGolden(ox, oy, s, frame, flash, defeated, breathing) {
  const P = (x, y, w, h, c) => R(x, y, w, h, c, s, ox, oy);
  const F = flash ? '#ffffff' : null;
  const col = c => F || c;
  const D = C.dark;

  if (defeated) {
    // 力尽きて伏せる（耳も尻尾もぺたんと垂れる）
    P(26, 25, 5, 4, D);                          // 垂れた尻尾
    P(27, 26, 4, 2, col(C.goldFurD));
    P(3, 19, 25, 11, D);                         // 横たわる胴
    P(4, 20, 23, 9, col(C.goldFur));
    P(4, 25, 23, 4, col(C.goldFurD));
    P(0, 21, 12, 9, D);                          // 地面についた頭とマズル
    P(1, 22, 10, 7, col(C.goldMuzzle));
    P(0, 22, 4, 3, C.nose);
    P(2, 26, 4, 1, D);                           // 閉じた目
    P(8, 19, 7, 11, D);                          // ぺたんと垂れた耳
    P(9, 20, 5, 9, col(C.goldEarD));
    return;
  }

  const sw = frame === 0 ? 0 : 1;                // 歩きのブレ

  // ===== 尻尾（胴のつけ根からふさふさの飾り毛が立ちのぼる）※先に描いて背面に回す
  P(25, 12, 5, 5, D);                            // つけ根（胴に重ねて繋げる）
  P(26, 13, 4, 3, col(C.goldFur));
  P(26, 8, 5, 6, D);
  P(27, 9, 4, 5, col(C.goldFurL));
  P(27, 4, 4, 5, D);                             // 先端の飾り毛
  P(28, 5, 3, 4, col(C.goldFurL));

  // ===== からだ（どっしりした胴）
  P(13, 13, 16, 15, D);
  P(14, 14, 14, 13, col(C.goldFur));
  P(14, 14, 14, 3, col(C.goldFurL));             // 背中のハイライト
  P(14, 23, 14, 4, col(C.goldFurD));             // お腹の影
  P(22, 17, 6, 9, col(C.goldFurD));              // 後ろ足のつけ根のふくらみ
  P(18, 24, 1, 4, col(C.goldFurD));              // 長い毛の流れ
  P(21, 24, 1, 4, col(C.goldFurD));

  // ===== 足
  P(15 + sw, 26, 5, 4, D);
  P(16 + sw, 27, 3, 3, col(C.goldFur));
  P(23 - sw, 26, 5, 4, D);
  P(24 - sw, 27, 3, 3, col(C.goldFur));

  // ===== 胸の飾り毛（ゴールデンらしいふさふさ）
  P(10, 14, 7, 13, D);
  P(11, 15, 5, 11, col(C.goldFurL));
  P(11, 20, 5, 3, col(C.goldFur));
  P(11, 25, 2, 3, col(C.goldFurL));              // 毛先がぎざぎざ
  P(14, 24, 2, 3, col(C.goldFurL));

  // ===== 頭
  P(2, 2, 14, 18, D);
  P(3, 3, 12, 16, col(C.goldFur));
  P(3, 3, 12, 4, col(C.goldFurL));               // 頭のてっぺんは明るい

  // ===== マズル（前に突き出す）
  P(0, 10, 8, 9, D);
  P(1, 11, 6, 7, col(C.goldMuzzle));
  P(1, 16, 6, 2, col(C.goldMuzzleD));

  // ===== 鼻（黒くて大きい）
  P(0, 9, 5, 4, D);
  P(0, 10, 4, 3, C.nose);
  P(1, 10, 1, 1, C.white);                       // 鼻のツヤ

  // ===== 目と眉
  P(6, 4, 5, 1, col(C.goldFurD));                // 眉
  P(7, 6, 4, 4, D);
  P(7, 6, 3, 3, C.goldEye);
  P(7, 6, 1, 1, C.white);

  // ===== たれ耳（丸くて濃い金色。頬の横に垂れる）
  P(12, 3, 5, 2, D);
  P(11, 5, 7, 13, D);
  P(12, 4, 5, 2, col(C.goldFurD));
  P(12, 6, 5, 11, col(C.goldEar));
  P(12, 13, 5, 4, col(C.goldEarD));
  P(13, 17, 3, 2, D);                            // 丸い耳先
  P(13, 17, 3, 1, col(C.goldEarD));

  // ===== 赤い首輪と迷子札
  P(9, 15, 3, 8, D);
  P(9, 16, 3, 6, '#d4443f');
  P(9, 19, 3, 1, '#f2e2b0');

  // ===== 口（炎を吐く時は大きく開く）
  if (breathing) {
    P(0, 14, 10, 8, D);
    P(1, 15, 8, 6, '#78202a');                   // 口の中
    P(1, 15, 7, 1, C.white);                     // 上の歯
    P(1, 20, 7, 1, C.white);                     // 下の歯
    P(2, 17, 6, 3, col(C.goldTongue));           // 舌
    P(2, 19, 6, 1, col(C.goldTongueD));
    P(0, 16, 2, 3, C.fireA);                     // 口元にたまる火種
  } else {
    P(1, 17, 7, 2, D);                           // にっと開いた口
    P(2, 19, 5, 4, D);                           // だらんと出た舌
    P(2, 19, 5, 3, col(C.goldTongue));
    P(2, 21, 5, 1, col(C.goldTongueD));
  }
}

// ================================================================= タイル
function drawTile(ch, px, py) {
  const g = TH.ground;
  if (ch === '#') {
    ctx.fillStyle = g[1]; ctx.fillRect(px, py, T, T);
    ctx.fillStyle = g[0]; ctx.fillRect(px, py, T, 5);
    ctx.fillStyle = g[2];
    ctx.fillRect(px, py + 15, T, 2);
    ctx.fillRect(px + 15, py + 5, 2, 10);
    ctx.fillRect(px + 6, py + 17, 2, 15);
    ctx.fillRect(px + 24, py + 17, 2, 15);
    ctx.fillStyle = g[3]; ctx.fillRect(px, py + T - 3, T, 3);
  } else if (ch === '=') {
    ctx.fillStyle = '#2a2018'; ctx.fillRect(px, py, T, 12);
    ctx.fillStyle = '#c98b4e'; ctx.fillRect(px + 1, py + 1, T - 2, 9);
    ctx.fillStyle = '#a86d38'; ctx.fillRect(px + 1, py + 7, T - 2, 3);
    ctx.fillStyle = '#e0a865'; ctx.fillRect(px + 1, py + 1, T - 2, 2);
  } else if (ch === 'B' || ch === 'H') {
    ctx.fillStyle = '#2a2018'; ctx.fillRect(px, py, T, T);
    ctx.fillStyle = '#b98246'; ctx.fillRect(px + 2, py + 2, T - 4, T - 4);
    ctx.fillStyle = '#96652f';
    ctx.fillRect(px + 2, py + 14, T - 4, 3);
    ctx.fillRect(px + 14, py + 2, 3, T - 4);
  } else if (ch === 'O') {                       // 叩いたあとの空き箱
    ctx.fillStyle = '#2a2018'; ctx.fillRect(px, py, T, T);
    ctx.fillStyle = '#7d5a33'; ctx.fillRect(px + 2, py + 2, T - 4, T - 4);
    ctx.fillStyle = '#5e421f'; ctx.fillRect(px + 6, py + 6, T - 12, T - 12);
  }
}

// ================================================================= ランドマーク
function windows(x, y, w, h, step, color) {
  ctx.fillStyle = color;
  for (let wy = y; wy < y + h - 8; wy += step) {
    for (let wx = x + 6; wx < x + w - 10; wx += 16) {
      if (((wx * 3 + wy * 7) >> 3) % 4) ctx.fillRect(wx, wy, 7, 9);
    }
  }
}

// キャロットタワー（三軒茶屋のシンボル・27階建て）
function drawCarrotTower(x, baseY, sc) {
  const w = 84 * sc, h = 300 * sc;

  // 本体
  ctx.fillStyle = '#3a2016'; ctx.fillRect(x - 2, y, w + 4, h);
  ctx.fillStyle = '#b4622e'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#c9723a'; ctx.fillRect(x, y, w * 0.55, h);
  ctx.fillStyle = '#8f4a20'; ctx.fillRect(x + w * 0.55, y, w * 0.16, h);
  windows(x, y + 20 * sc, w, h - 30 * sc, 15 * sc, 'rgba(255,225,170,0.55)');
  // 上部セットバック
  const w2 = w * 0.66, x2 = x + (w - w2) / 2, h2 = 44 * sc;

  // 展望フロア
  const w3 = w * 0.44, x3 = x + (w - w3) / 2, h3 = 22 * sc;
  ctx.fillStyle = '#3a2016'; ctx.fillRect(x3 - 2, y - h2 - h3, w3 + 4, h3);

  // アンテナ
  ctx.fillStyle = '#4a3428'; ctx.fillRect(x + w / 2 - 2 * sc, y - h2 - h3 - 40 * sc, 4 * sc, 40 * sc);

let BLD = [];
function buildSkyline() {
  BLD = [];
  let seed = 20260801;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let x = -200; x < LEVEL_W + 400; x += 70 + Math.floor(rnd() * 50)) {
    BLD.push({ x, w: 54 + Math.floor(rnd() * 46), h: 110 + Math.floor(rnd() * 190), t: rnd() });
  }
}

function drawBackground(cam) {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, TH.sky[0]); g.addColorStop(0.6, TH.sky[1]); g.addColorStop(1, TH.sky[2]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

  if (curStage && curStage.theme === 'under') {
    // 地下：土の断面とパイプ
    ctx.fillStyle = '#2c211b'; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = '#3a2b23';
    for (let i = 0; i < 60; i++) {
      const x = ((i * 137) - cam * 0.4) % (VW + 200);
      ctx.fillRect(x < -100 ? x + VW + 200 : x, (i * 53) % VH, 40, 26);
    }
    ctx.fillStyle = '#4d3c31';
    for (let i = 0; i < 12; i++) {
      const x = ((i * 320) - cam * 0.55) % (VW + 400);
      ctx.fillRect(x < -200 ? x + VW + 400 : x, 40 + (i % 3) * 90, 200, 12);
    }
  } else {
    // 雲
    ctx.fillStyle = TH.cloud;
    for (let i = 0; i < 14; i++) {
      const raw = ((i * 437) - cam * 0.15) % (LEVEL_W * 0.2 + 900);
      const x = raw < -160 ? raw + LEVEL_W * 0.2 + 900 : raw;
      const y = 26 + (i % 4) * 42;
      ctx.fillRect(x, y, 60, 14);
      ctx.fillRect(x + 12, y - 10, 34, 14);
      ctx.fillRect(x + 26, y - 18, 22, 12);
    }
    // 一般ビル
    for (const b of BLD) {
      const x = b.x - cam * 0.35;
      if (x + b.w < -20 || x > VW + 20) continue;
      const y = LEVEL_H - 96 - b.h;
      ctx.fillStyle = b.t > 0.5 ? TH.bldg[0] : TH.bldg[1];
      ctx.fillRect(x, y, b.w, b.h + 96);
      ctx.fillStyle = b.t > 0.5 ? TH.bldgTop[0] : TH.bldgTop[1];
      ctx.fillRect(x, y, b.w, 6);
      windows(x, y + 12, b.w, b.h + 40, 22, TH.win);
    }
    // ランドマーク
    if (curStage) for (const lm of curStage.landmarks) drawLandmark(lm, cam);
    // 街路樹
    for (let i = 0; i < 40; i++) {
      const x = i * 260 - cam * 0.6;
      if (x < -80 || x > VW + 80) continue;
      const y = LEVEL_H - 64;
      ctx.fillStyle = '#6b4a2c'; ctx.fillRect(x + 16, y - 40, 10, 46);
      ctx.fillStyle = TH.tree[0]; ctx.fillRect(x - 2, y - 86, 46, 46);
      ctx.fillStyle = TH.tree[1]; ctx.fillRect(x - 2, y - 86, 46, 14);
      ctx.fillStyle = TH.tree[2]; ctx.fillRect(x - 2, y - 52, 46, 12);
    }
  }
  if (TH.haze) { ctx.fillStyle = TH.haze; ctx.fillRect(0, 0, VW, VH); }
}

// ================================================================= サウンド
let ac = null;
function beep(freq, dur, type, vol) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, ac.currentTime);
  g.gain.setValueAtTime(vol || 0.08, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur);
}
function melody(notes, vol) {
  if (!ac) return;
  let t = ac.currentTime;
  for (const [f, d] of notes) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol || 0.1, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + d);
    t += d * 0.85;
  }
}
const SFX = {
  jump:  () => beep(620, 0.12, 'square', 0.06),
  jerky: () => { beep(980, 0.07); setTimeout(() => beep(1320, 0.09), 60); },
  stomp: () => beep(180, 0.14, 'sawtooth', 0.09),
  hurt:  () => { beep(300, 0.12, 'sawtooth', 0.09); setTimeout(() => beep(160, 0.2, 'sawtooth', 0.09), 100); },
  clear: () => melody([[523,0.14],[659,0.14],[784,0.14],[1047,0.34]]),
  over:  () => melody([[392,0.18],[330,0.18],[262,0.4]]),
  power: () => melody([[784,0.09],[988,0.09],[1175,0.09],[1568,0.22]]),
  warp:  () => melody([[262,0.1],[330,0.1],[392,0.1],[523,0.1],[659,0.22]]),
  boss:  () => melody([[147,0.22],[139,0.22],[131,0.4]], 0.12),
  bossHit: () => { beep(220, 0.1, 'square', 0.1); setTimeout(()=>beep(110,0.22,'sawtooth',0.1), 90); },
  fire:  () => beep(90 + Math.random() * 40, 0.16, 'sawtooth', 0.05),
  throwMug: () => { beep(300, 0.08, 'square', 0.05); setTimeout(()=>beep(200,0.1,'triangle',0.05), 70); },
};

const keys = {}, pressed = {};
const IS_TOUCH = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (IS_TOUCH) document.body.classList.add('touch');
// 表示テキストをキーボード用／タッチ用で出し分ける
const K = (kbd, touch) => IS_TOUCH ? touch : kbd;

function ensureAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {} }
  if (ac && ac.state === 'suspended') ac.resume();
}
function pressKey(code) { ensureAudio(); if (!keys[code]) pressed[code] = true; keys[code] = true; }
function releaseKey(code) { keys[code] = false; }
function tapKey(code) { pressKey(code); setTimeout(() => releaseKey(code), 90); }

addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  pressKey(e.code);
});
addEventListener('keyup', e => releaseKey(e.code));

// --- 画面上のボタン（マルチタッチ対応）
document.querySelectorAll('#touch button, #backBtn').forEach(btn => {
  const code = btn.dataset.k;
  const down = ev => {
    ev.preventDefault();
    btn.classList.add('on');
    pressKey(code);
    if (ev.pointerId != null && btn.setPointerCapture) {
      try { btn.setPointerCapture(ev.pointerId); } catch (e) {}
    }
  };
  const up = ev => { ev.preventDefault(); btn.classList.remove('on'); releaseKey(code); };
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('lostpointercapture', up);
  btn.addEventListener('contextmenu', e => e.preventDefault());
});

// --- メニュー画面はキャンバスを直接タップでも操作できる
cv.addEventListener('pointerdown', e => {
  if (state === 'play') return;
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * (VW / r.width);
  const y = (e.clientY - r.top) * (VH / r.height);
  if (state === 'title') {
    const b = OPENING_BTN;
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { startStory(); return; }
  }
  if (state === 'badges') { state = 'select'; return; }

    for (let a = 0; a < 3; a++) for (let c = 0; c < 3; c++) {

});

// ================================================================= 物理
const GRAV = 0.62, MAX_FALL = 15, RUN_ACC = 0.55, RUN_MAX = 4.4, FRICTION = 0.36, JUMP_V = -12.8;

function moveEntity(e) {
  e.x += e.vx;
  let c0 = Math.floor(e.x / T), c1 = Math.floor((e.x + e.w - 1) / T);
  let r0 = Math.floor(e.y / T), r1 = Math.floor((e.y + e.h - 1) / T);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (!isBlock(tileAt(c, r))) continue;
    if (e.vx > 0) { e.x = c * T - e.w; e.vx = 0; e.hitWall = true; }
    else if (e.vx < 0) { e.x = (c + 1) * T; e.vx = 0; e.hitWall = true; }
  }
  const prevBottom = e.y + e.h;
  e.y += e.vy;
  e.onGround = false;
  c0 = Math.floor(e.x / T); c1 = Math.floor((e.x + e.w - 1) / T);
  r0 = Math.floor(e.y / T); r1 = Math.floor((e.y + e.h - 1) / T);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const ch = tileAt(c, r);
    if (isBlock(ch)) {
      if (e.vy > 0) { e.y = r * T - e.h; e.vy = 0; e.onGround = true; }
      else if (e.vy < 0) { e.y = (r + 1) * T; e.vy = 0; if (e.isPlayer) bumpBlock(c, r); }
    } else if (ch === '=' && e.vy > 0 && prevBottom <= r * T + 2) {
      e.y = r * T - e.h; e.vy = 0; e.onGround = true;
    }
  }
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function loadStage(def, index) {
  curStage = def; curIndex = index;
  curArea = def.hidden ? HIDDEN : areaAt(index);
  TH = THEMES[def.theme || curArea.theme];
  LEVEL = [];
  for (let r = 0; r < ROWS; r++)
    LEVEL.push(def.chunks.map(ch => (ch[r] || '').padEnd(30, '.').slice(0, 30)).join(''));
  COLS = LEVEL[0].length;
  LEVEL_W = COLS * T;
  buildSkyline();

  const enemyKind = def.enemy || (curArea && curArea.enemy) || 'stache';
  const bossHp = def.bossHp || 3;
  enemies = []; jerkies = []; manholes = []; particles = []; owner = null; boss = null;
  items = []; secrets = []; popups = []; fires = [];
  player = { x: 64, y: 300, w: 44, h: 32, vx: 0, vy: 0, dir: 1, isPlayer: true,
             onGround: false, coyote: 0, buffer: 0, inv: 0, anim: 0,
             power: 'none', powerFlash: 0 };

  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const ch = LEVEL[r][c];
    if (ch === 'P') { player.x = c * T + 2; player.y = r * T; }
    else if (ch === 'E') enemies.push({ x:c*T, y:r*T-4, w:28, h:34, vx:-ENEMY_SPEED[enemyKind], vy:0,
                                        onGround:false, hitWall:false, dead:0, alive:true,
                                        kind:enemyKind, jumpCd:50 + (c * 17) % 70 });
    else if (ch === 'J') jerkies.push({ x:c*T+6, y:r*T+8, w:20, h:16, got:false, ph:(c*7+r*13)%60 });
    else if (ch === 'G') owner = { x:c*T, y:r*T-26, w:32, h:58 };
    else if (ch === 'M') manholes.push({ x:c*T, y:r*T, w:32, h:32 });
    else if (ITEM_OF[ch]) { items.push({ x:c*T+7, y:r*T+8, w:18, h:18, kind:ITEM_OF[ch], got:false, ph:(c*11)%60 });
                            LEVEL[r] = LEVEL[r].slice(0,c) + '.' + LEVEL[r].slice(c+1); }
    else if (ch === 'H') secrets.push({ col:c, row:r, opened:false });
    else if (ch === 'X') {
      boss = { x:c*T, y:r*T-48, w:64, h:80, vx:1.4, vy:0, onGround:false,
               hitWall:false, hp:bossHp, maxHp:bossHp, inv:0, alive:true,
               jumpCd:110, dead:0, drunk: !!def.bossDrunk, golden: !!def.bossGolden,
               breathCd:90, breath:0, throwCd:80, homeX:c*T, homeY:r*T-48 };
      // 足場が地続きな範囲を調べて、そこから出られないようにする（穴に落ちて詰むのを防ぐ）
      const gr = r + 1;
      let lo = c, hi = c;
      while (lo > 0 && isBlock(LEVEL[gr][lo - 1])) lo--;
      while (hi < COLS - 1 && isBlock(LEVEL[gr][hi + 1])) hi++;
      boss.minX = lo * T;
      boss.maxX = (hi + 1) * T - boss.w;
    }
  }
  stageJerky = jerkies.length;
  player.power = 'none'; player.powerFlash = 0;
  player.safeX = player.x; player.safeY = player.y;
  ghostPath = []; ghostPlay = (!def.hidden && save.ghosts && save.ghosts[index]) || null;
  runNoDamage = true; runBossHit = false;
  cam = 0; powerCount = 0; powerTimer = 0; msgTimer = 0; msgText = '';
  stageTimer = 0;
  if (boss) SFX.boss();
}

// ================================================================= 更新
function updatePlay() {
  const p = player;
  let ax = 0;
  if (held('ArrowLeft', 'KeyA')) ax -= 1;
  if (held('ArrowRight', 'KeyD')) ax += 1;
  if (ax !== 0) {
    p.vx += ax * RUN_ACC;
    let mx = RUN_MAX * (p.power === 'dash' ? 1.45 : 1);
    if (powerTimer > 0) mx *= 1.25;
    p.vx = Math.max(-mx, Math.min(mx, p.vx));
    p.dir = ax; p.anim += Math.abs(p.vx) * 0.09;
  } else {
    if (p.vx > 0) p.vx = Math.max(0, p.vx - FRICTION);
    else if (p.vx < 0) p.vx = Math.min(0, p.vx + FRICTION);
  }

  if (justPressed('Space', 'ArrowUp', 'KeyW')) p.buffer = 8;
  if (p.buffer > 0) p.buffer--;
  if (p.onGround) p.coyote = 6; else if (p.coyote > 0) p.coyote--;
  if (p.buffer > 0 && p.coyote > 0) {
    p.vy = JUMP_V * (p.power === 'spring' ? 1.17 : 1);
    p.buffer = 0; p.coyote = 0; p.onGround = false; SFX.jump();
  }
  if (p.vy < -4 && !held('Space', 'ArrowUp', 'KeyW')) p.vy = -4;
  p.vy = Math.min(MAX_FALL, p.vy + GRAV);
  moveEntity(p);
  if (p.x < 0) { p.x = 0; p.vx = 0; }
  if (p.x + p.w > LEVEL_W) { p.x = LEVEL_W - p.w; p.vx = 0; }

  stageTimer++;
  if (p.onGround && tick % 20 === 0) { p.safeX = p.x; p.safeY = p.y - 8; }
  if (p.inv > 0) p.inv--;
  if (powerTimer > 0) {
    powerTimer--;
    if (tick % 3 === 0) spawnSparkle(p.x + 10 + Math.random() * 30, p.y + Math.random() * 30,
                                     'hsl(' + ((tick * 11) % 360) + ',100%,72%)');
    if (powerTimer === 0) flashMsg('無敵モード終了');
  }
  if (p.y > LEVEL_H + 60) damage(true);

  // --- マンホール（隠しステージ入口）
  for (const m of manholes) {
    if (overlap(p, m) && p.onGround) {
      if (justPressed('ArrowDown', 'KeyS')) { startHidden(); return; }
      if (tick % 40 === 0) spawnSparkle(m.x + 16, m.y + 20, '#ffe08a');
    }
  }

  // --- 敵
  for (const e of enemies) {
    if (!e.alive) { if (e.dead > 0) e.dead--; continue; }
    e.hitWall = false;
    const dx = (player.x + player.w / 2) - (e.x + e.w / 2);
    if (e.kind === 'drunk') {
      if (e.onGround && --e.jumpCd <= 0) {
        e.vy = -10.6; e.jumpCd = 46 + (tick % 30);            // よく跳ねる
        e.vx = (dx > 0 ? 1 : -1) * ENEMY_SPEED.drunk * 1.5;   // 跳びながら寄ってくる
      }
      e.vx += Math.sin(tick * 0.07 + e.x) * 0.02;             // 千鳥足
    } else if (e.kind === 'suit') {
      // 視界に入ると突進してくる
      const see = Math.abs(dx) < 230 && Math.abs((player.y) - e.y) < 60;
      if (see && !e.charge) { e.charge = 70; e.vx = (dx > 0 ? 1 : -1) * ENEMY_SPEED.suit * 1.7; }
      if (e.charge > 0 && --e.charge === 0) e.vx = Math.sign(e.vx) * ENEMY_SPEED.suit;
    }
    e.vy = Math.min(MAX_FALL, e.vy + GRAV);
    moveEntity(e);
    if (e.hitWall) e.vx = -e.vx;
    if (e.onGround) {
      const aheadC = Math.floor((e.x + (e.vx > 0 ? e.w + 2 : -2)) / T);
      const belowR = Math.floor((e.y + e.h + 4) / T);
      const below = tileAt(aheadC, belowR);
      if (!isBlock(below) && below !== '=') e.vx = -e.vx;
    }
    if (e.y > LEVEL_H + 80) { e.alive = false; e.dead = 0; continue; }

    if (overlap(p, e)) {
      if (powerTimer > 0) {
        e.alive = false; e.dead = 40; score += 300;
        save.powerKills = (save.powerKills || 0) + 1; checkBadges();
        for (let i = 0; i < 8; i++) spawnSparkle(e.x + 14, e.y + 16, '#ffd34d');
        SFX.stomp();
      } else if (p.vy > 0 && (p.y + p.h) - e.y < 22) {
        e.alive = false; e.dead = 40; p.vy = -9; score += 200; SFX.stomp();
      } else if (p.inv <= 0) damage(false);
    }
  }

  // --- ボス
  if (boss && boss.alive) updateBoss();
  else if (boss && boss.dead > 0) boss.dead--;
  updateFires();

  // --- ジャーキー
  for (const j of jerkies) {
    if (j.got) continue;
    if (overlap(p, j)) {
      j.got = true;
      score += j.secret ? 500 : 100;
      save.totalJerky = (save.totalJerky || 0) + 1;
      SFX.jerky();
      for (let i = 0; i < (j.secret ? 12 : 4); i++) spawnSparkle(j.x + 10, j.y + 8, '#ffd34d');
      if (j.secret) popup(j.x, j.y - 10, '+500', '#ffe07a');
      checkBadges();
      powerCount++;
      if (powerCount >= POWER_NEED) {
        powerCount = 0; powerTimer = POWER_TIME;
        p.inv = Math.max(p.inv, 30);
        flashMsg('★ きらきら無敵モード！ ★');
        SFX.power();
        for (let i = 0; i < 26; i++)
          spawnSparkle(p.x + 22, p.y + 16, 'hsl(' + (i * 14) + ',100%,70%)');
      }
    }
  }

  // --- ゴール
  if (owner && overlap(p, owner)) {
    if (boss && boss.alive) {
      if (msgTimer <= 0) flashMsg('ボスをたおさないと近づけない！');
    } else {
      clearStage();
    }
  }

  // --- パワーアップアイテム
  for (const it of items) {
    if (it.got) continue;
    if (overlap(p, it)) {
      it.got = true;
      p.power = it.kind; p.powerFlash = 40;
      save.usedPowers[it.kind] = true; persist(); checkBadges();
      score += 300;
      popup(it.x, it.y - 12, POWERS[it.kind].name + '！', POWERS[it.kind].color2);
      flashMsg(POWERS[it.kind].name + '　' + POWERS[it.kind].desc);
      for (let i = 0; i < 18; i++) spawnSparkle(it.x + 9, it.y + 9, POWERS[it.kind].color2);
      SFX.power();
    }
  }
  if (p.powerFlash > 0) p.powerFlash--;
  if (p.power !== 'none' && tick % 4 === 0)
    spawnSparkle(p.x + 8 + Math.random() * 28, p.y + 24, POWERS[p.power].color2);

  // --- ゴースト（自己ベストの走りを記録・再生）
  if (stageTimer % 5 === 0 && ghostPath.length < 3000)
    ghostPath.push(Math.round(p.x), Math.round(p.y));

  for (let i = popups.length - 1; i >= 0; i--) { popups[i].y -= 0.7; if (--popups[i].life <= 0) popups.splice(i, 1); }
  for (let i = badgeToast.length - 1; i >= 0; i--) if (--badgeToast[i].life <= 0) badgeToast.splice(i, 1);

  updateParticles();
  if (msgTimer > 0) msgTimer--;

  const target = p.x + p.w / 2 - VW * 0.42;
  cam += (target - cam) * 0.12;
  cam = Math.max(0, Math.min(LEVEL_W - VW, cam));
}

function updateBoss() {
  const b = boss, p = player;
  if (b.inv > 0) b.inv--;
  b.hitWall = false;

  // プレイヤーを追いかける
  let speed = 1.4 + (b.maxHp - b.hp) * 0.45;
  if (b.drunk) speed *= 1 + Math.sin(tick * 0.05) * 0.45;      // 千鳥足でふらつく
  b.vx = (p.x + p.w / 2 < b.x + b.w / 2) ? -speed : speed;

  // ゴールデンレトリバーは走りながらでも跳びながらでも炎を吐く
  if (b.golden) {
    if (b.breath > 0) {
      b.breath--;
      b.vx *= 0.45;                                    // 吐いている間は少しだけ減速
      const mouthY = b.y + 26;
      const dir = b.faceDir || -1;
      const mouthX = dir < 0 ? b.x - 6 : b.x + b.w - 6;
      if (b.breath > 20) {
        // 溜め：口元に火の粉が集まる
        if (tick % 3 === 0) spawnSparkle(mouthX + 9, mouthY + 6, C.fireB);
      } else if (b.breath % 4 === 0) {
        fires.push({ x:mouthX, y:mouthY + Math.floor(Math.random() * 8) - 4,
                     w:22, h:22, vx:dir * 5.2, vy:0, life:110, kind:'fire' });
        SFX.fire();
      }
    } else {
      b.faceDir = (p.x + p.w / 2 < b.x + b.w / 2) ? -1 : 1;
      if (--b.breathCd <= 0) {
        b.breath = 44;                                 // 溜め24 + 発射20
        b.breathCd = 70 - (b.maxHp - b.hp) * 10;       // 追い詰めるほど連射が速い
      }
    }
  }

  // 酔っぱらいはジョッキを放物線で投げつける
  if (b.drunk && --b.throwCd <= 0) {
    const dir = (p.x + p.w / 2 < b.x + b.w / 2) ? -1 : 1;
    b.throwCd = 130 - (b.maxHp - b.hp) * 18;
    fires.push({ x: dir < 0 ? b.x - 8 : b.x + b.w - 12, y: b.y + 4,
                 w:20, h:20, vx: dir * 4.6, vy:-7.6, life:220, kind:'mug', spin:0 });
    SFX.throwMug();
  }

  b.jumpCd--;
  if (b.jumpCd <= 0 && b.onGround) {
    b.vy = -13; b.jumpCd = 150 - (3 - b.hp) * 30;
  }
  b.vy = Math.min(MAX_FALL, b.vy + GRAV);
  moveEntity(b);
  // 足場の範囲に閉じ込める
  if (b.minX !== undefined) {
    if (b.x < b.minX) { b.x = b.minX; b.vx = Math.abs(b.vx); }
    if (b.x > b.maxX) { b.x = b.maxX; b.vx = -Math.abs(b.vx); }
  }
  if (b.x < 0) b.x = 0;
  if (b.x + b.w > LEVEL_W) b.x = LEVEL_W - b.w;
  // 万一落ちても復帰させる（倒せなくなるのを防ぐ）
  if (b.y > LEVEL_H + 40) { b.x = b.homeX; b.y = b.homeY; b.vx = 0; b.vy = 0; }

  if (overlap(p, b)) {
    const stomping = p.vy > 0 && (p.y + p.h) - b.y < 36;
    if (b.inv > 0) {
      // ボスがひるんでいる間は当たり判定なし（跳ねた直後の連続被弾を防ぐ）
    } else if (powerTimer > 0) {
      hitBoss(2);                                  // 無敵モード中は2ダメージ
      p.vy = -13; p.inv = Math.max(p.inv, 55);
    } else if (stomping) {
      hitBoss(1);
      p.vy = -13; p.inv = Math.max(p.inv, 55);     // しっかり跳ね上がって離れる
    } else if (p.inv <= 0) {
      const before = lives;
      damage(false);
      if (lives !== before || p.power === 'none') runBossHit = true;
    }
  }
}

// ボスの飛び道具：炎はまっすぐ、ジョッキは放物線。壁や地面に当たると砕ける
function burst(f) {
  const c1 = f.kind === 'mug' ? C.beer : C.fireB;
  const c2 = f.kind === 'mug' ? C.beerFoam : C.fireC;
  for (let i = 0; i < 12; i++) spawnSparkle(f.x + 10, f.y + 10, i % 2 ? c1 : c2);
  f.life = 0;
}

function updateFires() {
  if (!fires.length) return;
  const p = player;
  for (const f of fires) {
    if (f.kind === 'mug') {
      f.vy = Math.min(MAX_FALL, f.vy + GRAV * 0.6);          // ゆるやかな放物線
      f.y += f.vy;
      f.spin += f.vx < 0 ? -0.22 : 0.22;                     // くるくる回りながら飛ぶ
      if (tick % 4 === 0) spawnSparkle(f.x + 10, f.y + 12, C.beer);
    } else if (tick % 2 === 0) {
      spawnSparkle(f.x + 11, f.y + 14, Math.random() < 0.5 ? C.fireB : C.fireC);
    }
    f.x += f.vx;
    f.life--;
    if (f.life <= 0) continue;

    const midRow = Math.floor((f.y + f.h / 2) / T);
    const edge = Math.floor((f.vx < 0 ? f.x : f.x + f.w) / T);
    if (isBlock(tileAt(edge, midRow))) { burst(f); continue; }          // 壁に当たる
    if (f.kind === 'mug') {
      const botRow = Math.floor((f.y + f.h) / T);
      if (isBlock(tileAt(Math.floor((f.x + f.w / 2) / T), botRow))) { burst(f); continue; }  // 地面で割れる
      if (f.y > LEVEL_H + 60) { f.life = 0; continue; }                 // 穴に落ちたら消える
    }
    if (f.x < -80 || f.x > LEVEL_W + 80) { f.life = 0; continue; }

    if (overlap(p, f)) {
      if (powerTimer > 0) {
        burst(f);                                            // 無敵モードなら弾き飛ばす
      } else if (p.inv <= 0) {
        const before = lives;
        damage(false);
        burst(f);
        if (lives !== before || p.power === 'none') runBossHit = true;
      }
    }
  }
  fires = fires.filter(f => f.life > 0);
}

function hitBoss(n) {
  const b = boss;
  if (b.hp <= 0) return;
  b.hp -= n; b.inv = 80;
  score += 500;
  for (let i = 0; i < 16; i++) spawnSparkle(b.x + 28, b.y + 30, '#ff9a5c');
  SFX.bossHit();
  if (b.hp <= 0) {
    b.alive = false; b.dead = 60;
    fires = [];                                    // 残った炎で事故らないように消す
    score += 2000;
    for (let i = 0; i < 40; i++) spawnSparkle(b.x + 28, b.y + 40, 'hsl(' + (i * 9) + ',100%,68%)');
    flashMsg('ボス撃破！ ご主人のもとへ！');
    SFX.clear();
  }
}

function clearStage() {
  SFX.clear();
  let bestUpdated = false;
  const perfect = jerkies.every(j => j.got);
  if (curStage.hidden) {
    save.hiddenCleared = true;
    if (perfect) save.hiddenPerfect = true;
  } else {
    save.cleared[curIndex] = true;
    if (perfect) save.perfect[curIndex] = true;
    // ベストタイム（速いほうを残す）
    if (!save.times[curIndex] || stageTimer < save.times[curIndex]) {
      save.times[curIndex] = stageTimer; bestUpdated = true;
    }
  }
  const total = score + lives * 500;
  if (total > save.best) save.best = total;

  if (!curStage.hidden) {
    // ベスト更新時だけゴーストを残す（サイズ節約のため間引いて保存）
    if (bestUpdated) save.ghosts[curIndex] = ghostPath.slice(0, 3000);
  }
  if (runNoDamage) unlockBadge('noDamage');
  if (stageTimer <= 45 * 60) unlockBadge('speedrun');
  if (curStage.boss && !runBossHit) unlockBadge('bossNoDmg');
  checkBadges();
  persist();
  // ラスボスを倒したらエンディングへ
  if (curStage.last) { clearScore = total; startEnding(); }
  else state = 'clear';
}

function damage(fell) {
  // ロングフォルは1回だけダメージを防ぐ
  if (!fell && player.power === 'long') {
    player.power = 'none'; player.inv = 90; player.powerFlash = 30;
    flashMsg('ロングフォルが身代わりになった！');
    for (let i = 0; i < 16; i++) spawnSparkle(player.x + 22, player.y + 16, '#ffd7a0');
    SFX.stomp();
    return;
  }
  runNoDamage = false;
  player.power = 'none';
  lives--; SFX.hurt(); powerCount = 0; powerTimer = 0;
  if (lives <= 0) { state = 'gameover'; SFX.over(); return; }
  player.inv = 90;
  if (fell) { player.x = player.safeX; player.y = player.safeY; player.vx = 0; player.vy = 0; }
  else { player.vy = -7; player.vx = -player.dir * 3; }
}

// ================================================================= 描画
function drawWorld() {
  drawBackground(cam);
  const ox = -Math.round(cam);
  const cStart = Math.max(0, Math.floor(cam / T) - 1);
  const cEnd = Math.min(COLS - 1, Math.ceil((cam + VW) / T));
  for (let r = 0; r < ROWS; r++) for (let c = cStart; c <= cEnd; c++) {
    const ch = LEVEL[r][c];
    if (ch === '#' || ch === '=' || ch === 'B' || ch === 'H' || ch === 'O') drawTile(ch, ox + c * T, r * T);
  }

  for (const m of manholes) drawManhole(ox + m.x, m.y, overlap(player, m));

  for (const j of jerkies) {
    if (j.got) continue;
    if (j.x + 60 < cam || j.x - 60 > cam + VW) continue;
    const by = j.y + Math.sin((tick + j.ph) * 0.09) * 3;
    if (j.secret) {
      ctx.fillStyle = 'rgba(255,224,122,' + (0.25 + Math.sin(tick * 0.12) * 0.15) + ')';
      ctx.fillRect(ox + j.x - 8, by - 8, 36, 32);
    }
    drawJerky(ox + j.x, by, 2);
  }

  // パワーアップアイテム
  for (const it of items) {
    if (it.got) continue;
    if (it.x + 60 < cam || it.x - 60 > cam + VW) continue;
    const by = it.y + Math.sin((tick + it.ph) * 0.08) * 4;
    const pw = POWERS[it.kind];
    const gr = ctx.createRadialGradient(ox + it.x + 9, by + 9, 3, ox + it.x + 9, by + 9, 26);
    gr.addColorStop(0, pw.color2 + 'aa'); gr.addColorStop(1, pw.color2 + '00');
    ctx.fillStyle = gr; ctx.fillRect(ox + it.x - 17, by - 17, 52, 52);
    drawItem(ox + it.x - 3, by - 3, 2, it.kind, tick);
  }

  // ゴースト（自己ベストの走り）
  if (ghostPlay && ghostPlay.length >= 2) {
    const gi = Math.min(Math.floor(stageTimer / 5), ghostPlay.length / 2 - 1) * 2;
    const gx = ghostPlay[gi], gy = ghostPlay[gi + 1];
    if (!(gx + 80 < cam || gx - 80 > cam + VW)) {
      ctx.save(); ctx.globalAlpha = 0.32;
      drawDog(ox + gx - 4, gy, 2, Math.floor(tick / 8) % 2, false, false);
      ctx.restore();
    }
  }

  if (owner && !(owner.x + 140 < cam || owner.x - 140 > cam + VW)) {
    const locked = boss && boss.alive;
    if (!locked) {
      const gx = ox + owner.x + 16, gy = owner.y + 30, rad = 70 + Math.sin(tick * 0.06) * 8;
      const glow = ctx.createRadialGradient(gx, gy, 8, gx, gy, rad);
      glow.addColorStop(0, 'rgba(255,236,170,0.55)');
      glow.addColorStop(0.6, 'rgba(255,225,140,0.18)');
      glow.addColorStop(1, 'rgba(255,220,120,0)');
      ctx.fillStyle = glow; ctx.fillRect(gx - rad, gy - rad, rad * 2, rad * 2);
    }
    drawOwner(ox + owner.x, owner.y, 2, Math.floor(tick / 22) % 2 === 0);
    ctx.fillStyle = locked ? '#ffffff' : C.dark;
    ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(locked ? 'たすけて！' : 'ご主人！', ox + owner.x + 16, owner.y - 12);
  }

  for (const e of enemies) {
    if (!e.alive && e.dead <= 0) continue;
    if (e.x + 80 < cam || e.x - 80 > cam + VW) continue;
    const f = Math.floor(tick / (e.kind === 'suit' ? 6 : 9)) % 2;
    const draw = ENEMY_DRAW[e.kind] || drawStache;
    ctx.save();
    if (e.vx > 0) { ctx.translate(ox + e.x + e.w + 2, e.y - 6); ctx.scale(-1, 1); draw(0, 0, 2, f, !e.alive); }
    else draw(ox + e.x - 2, e.y - 6, 2, f, !e.alive);
    ctx.restore();
  }

  if (boss && (boss.alive || boss.dead > 0)) {
    const f = Math.floor(tick / 8) % 2;
    const flash = boss.inv > 0 && Math.floor(tick / 4) % 2 === 0;
    // ゴールデンは炎を吐く間は足を止めるので、向きは vx ではなく faceDir で決める
    const facingRight = boss.golden ? boss.faceDir > 0 : boss.vx > 0;
    const paint = (x, y) => boss.golden
      ? drawGolden(x, y, 3, f, flash, !boss.alive, boss.breath > 0)
      : drawBoss(x, y, 3, f, flash, !boss.alive, boss.drunk);
    ctx.save();
    if (facingRight) { ctx.translate(ox + boss.x + boss.w + 10, boss.y - 10); ctx.scale(-1, 1); paint(0, 0); }
    else paint(ox + boss.x - 10, boss.y - 10);
    ctx.restore();
  }

  // ボスの飛び道具（炎は進行方向にのばし、ジョッキは回転させる）
  for (const fl of fires) {
    if (fl.x + 60 < cam || fl.x - 60 > cam + VW) continue;
    ctx.save();
    if (fl.kind === 'mug') {
      ctx.translate(ox + fl.x + 10, fl.y + 10);
      ctx.rotate(fl.spin);
      drawMug(-10, -10, 2);
    } else if (fl.vx > 0) {
      ctx.translate(ox + fl.x + 24, fl.y); ctx.scale(-1, 1); drawFlame(0, 0, 2, tick);
    } else {
      drawFlame(ox + fl.x, fl.y, 2, tick);
    }
    ctx.restore();
  }

  drawParticles(ox);

  const p = player;
  if (!(p.inv > 0 && powerTimer <= 0 && Math.floor(tick / 4) % 2 === 0)) {
    if (powerTimer > 0) {
      const gx = ox + p.x + 22, gy = p.y + 16, rad = 46;
      const glow = ctx.createRadialGradient(gx, gy, 4, gx, gy, rad);
      glow.addColorStop(0, 'hsla(' + ((tick * 7) % 360) + ',100%,75%,0.5)');
      glow.addColorStop(1, 'hsla(' + ((tick * 7) % 360) + ',100%,75%,0)');
      ctx.fillStyle = glow; ctx.fillRect(gx - rad, gy - rad, rad * 2, rad * 2);
    }
    const walking = Math.abs(p.vx) > 0.4 && p.onGround;
    const f = !p.onGround ? 1 : (walking ? Math.floor(p.anim) % 2 : 0);
    const stretch = p.power === 'long' ? 1.85 : 1;         // ロングフォルは胴がぐっと伸びる
    const legEx = p.power === 'spring' ? 7 : 0;             // ばねの足は脚がぐんと伸びる
    const flash = p.powerFlash > 0 && Math.floor(tick / 3) % 2 === 0;
    if (p.power !== 'none') {                              // パワーアップ中のオーラ
      const pw = POWERS[p.power], gx = ox + p.x + 22, gy = p.y + 16, rad = 42;
      const gl = ctx.createRadialGradient(gx, gy, 4, gx, gy, rad);
      gl.addColorStop(0, pw.color2 + '66'); gl.addColorStop(1, pw.color2 + '00');
      ctx.fillStyle = gl; ctx.fillRect(gx - rad, gy - rad, rad * 2, rad * 2);
    }
    ctx.save();
    if (p.dir < 0) {
      ctx.translate(ox + p.x + p.w + 4, p.y - legEx * 2); ctx.scale(-stretch, 1);
      drawDog(0, 0, 2, f, flash, powerTimer > 0, legEx);
    } else {
      ctx.translate(ox + p.x + p.w + 4, p.y - legEx * 2); ctx.scale(stretch, 1);
      drawDog(-(p.w + 8) / 1, 0, 2, f, flash, powerTimer > 0, legEx);
    }
    ctx.restore();
  }
}

function drawHUD() {
  ctx.fillStyle = 'rgba(20,16,12,0.78)';
  ctx.fillRect(0, 0, VW, 40);

  drawJerky(14, 10, 2);
  const got = jerkies.filter(j => j.got).length;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 17px "Hiragino Maru Gothic ProN", sans-serif';

  // 取得したパワーアップの表示
  if (player.power !== 'none') {

    ctx.fillStyle = 'rgba(20,16,12,0.7)'; ctx.fillRect(14, 46, 116, 24);
    ctx.strokeStyle = pw.color; ctx.lineWidth = 2; ctx.strokeRect(15, 47, 114, 22);

    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.font = '11px "Hiragino Maru Gothic ProN", sans-serif';

  }

  // ポップアップ（+500 など）
  const ox2 = -Math.round(cam);
  for (const q of popups) {
    ctx.textAlign = 'center';
    ctx.globalAlpha = Math.min(1, q.life / 30);
    ctx.fillStyle = q.color || '#fff';
    ctx.font = 'bold 15px "Hiragino Maru Gothic ProN", sans-serif';
    ctx.fillText(q.text, ox2 + q.x + 10, q.y);

  // 実績バッジの通知
  badgeToast.forEach((bt, i) => {
    const b = BADGES.find(x => x.id === bt.id);

    ctx.fillStyle = 'rgba(20,16,12,0.85)'; ctx.fillRect(VW - 300, y, 286, 40);
    ctx.fillStyle = '#ffcb05'; ctx.fillRect(VW - 300, y, 4, 40);
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffcb05';
    ctx.font = 'bold 13px "Hiragino Maru Gothic ProN", sans-serif';
    ctx.fillText('🏅 バッジ獲得！　' + b.name, VW - 288, y + 17);

    ctx.font = '11px "Hiragino Maru Gothic ProN", sans-serif';
    ctx.fillText(b.desc, VW - 288, y + 33);
    ctx.globalAlpha = 1;

  // メッセージ
  if (msgTimer > 0) {

const CELL_W = 236, CELL_H = 96, GRID_X = (VW - (CELL_W * 3 + 28)) / 2, GRID_Y = 66, ROW_STEP = 108;
const HIDDEN_BAR = { x: GRID_X, y: GRID_Y + ROW_STEP * 3 - 4, w: CELL_W * 3 + 28, h: 38 };

function cellRect(row, col) {
  return { x: GRID_X + col * (CELL_W + 14), y: GRID_Y + row * ROW_STEP, w: CELL_W, h: CELL_H };
}
const hiddenRowAvailable = () => save.hiddenFound;
function clampSel() {
  const maxRow = hiddenRowAvailable() ? 3 : 2;
  selRow = Math.max(0, Math.min(maxRow, selRow));
  selCol = Math.max(0, Math.min(2, selCol));
}

// カードのサムネイル
function stageThumb(r, idx, def, locked) {
  ctx.save();
  ctx.beginPath(); ctx.rect(r.x + 8, r.y + 8, 76, CELL_H - 16); ctx.clip();
  const th = THEMES[def.hidden ? 'under' : AREAS[Math.floor(idx / 3)].theme];
  const g = ctx.createLinearGradient(0, r.y + 8, 0, r.y + CELL_H - 8);
  g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[2]);
  ctx.fillStyle = g; ctx.fillRect(r.x + 8, r.y + 8, 76, CELL_H - 16);
  const bx = r.x + 10, by = r.y + CELL_H - 18;
  if (def.hidden) { ctx.fillStyle = '#2c211b'; ctx.fillRect(r.x + 8, r.y + 8, 76, CELL_H - 16); drawManhole(r.x + 30, by - 34, true); }
  else {
    const t0 = (def.landmarks[0] || {}).t;
    if (t0 === 'echo') drawEchoGate(bx - 26, by, 0.62);
    else if (t0 === 'suzuran') drawSuzuran(bx - 20, by, 0.52);
    else if (t0 === 'izakaya') drawIzakaya(bx - 8, by, 0.5);
    else if (t0 === 'shops') drawShops(bx - 10, by, 0.44);
    else if (t0 === 'tram') drawTram(bx + 4, by, 0.42);
    else if (t0 === 'elevated') drawElevated(bx - 30, by + 42, 0.34);
    else if (t0 === 'beer') drawBeerBar(bx + 2, by, 0.6);
    else if (t0 === 'gorilla') drawGorillaBuilding(bx + 4, by, 0.52);
    else drawCarrotTower(bx + 16, by, 0.24);
    ctx.fillStyle = th.ground[1]; ctx.fillRect(r.x + 8, by, 76, 12);
  }
  if (locked) { ctx.fillStyle = 'rgba(8,8,12,0.82)'; ctx.fillRect(r.x + 8, r.y + 8, 76, CELL_H - 16); }
  ctx.restore();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1;
  ctx.strokeRect(r.x + 8.5, r.y + 8.5, 76, CELL_H - 16);
}

        }
      }
    });
  });

  // 隠しステージ
  if (hiddenRowAvailable()) {

    ctx.textAlign = 'right';
    ctx.fillStyle = save.hiddenCleared ? '#7fe08a' : 'rgba(255,255,255,0.6)';
    ctx.font = '12px "Hiragino Maru Gothic ProN", sans-serif';
    ctx.fillText(save.hiddenCleared ? (save.hiddenPerfect ? '★ 全取得クリア' : '✔ クリアずみ') : '未クリア',
                 b.x + b.w - 10, b.y + 24);
  } else {

  }

  ctx.fillStyle = 'rgba(255,255,255,0.8)';

                 'ステージをタップ → もう一度タップではじめる'), VW / 2, VH - 8);

  // バッジ画面へのボタン
  const bb = BADGE_BTN;

function launchSelected() {

    if (!hiddenRowAvailable()) return;
    loadStage(HIDDEN, -1); lives = 3; score = 0; state = 'play'; SFX.warp();
    return;
  }
  const idx = selRow * 3 + selCol;
  if (stageUnlocked(idx)) startStage(idx);
}

function storyStage(camX, dark) {
  TH = THEMES.evening;
  curStage = null;
  drawBackground(camX);
  for (let c = 0; c <= VW / T; c++)
    for (let r = 11; r <= 14; r++) drawTile('#', c * T, r * T);

}

function leash(x1, y1, x2, y2, slack) {
  ctx.strokeStyle = '#c85a3a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.quadraticCurveTo((x1 + x2) / 2, Math.max(y1, y2) + (slack || 26), x2, y2);
  ctx.stroke();
}

function speech(x, y, text, color) {
  ctx.font = 'bold 18px "Hiragino Maru Gothic ProN", sans-serif';
  ctx.textAlign = 'center';
  const w = ctx.measureText(text).width + 30;
  ctx.fillStyle = '#2a2018'; ctx.fillRect(x - w / 2 - 3, y - 31, w + 6, 38);
  ctx.fillStyle = '#fffaf0'; ctx.fillRect(x - w / 2, y - 28, w, 32);
  ctx.fillStyle = '#2a2018'; ctx.fillRect(x - 5, y + 4, 10, 9);
  ctx.fillStyle = color || '#2a2018';
  ctx.fillText(text, x, y - 6);
}

// 累計で集めたジャーキーの数に応じて、おうちの山が育つ（7段まで）
function pileSize() { return Math.max(6, Math.min(28, Math.floor((save.totalJerky || 0) / 12))); }

// ごはんの器と、山盛りのジャーキー
function jerkyPile(x, y, n, t) {
  // 器
  ctx.fillStyle = '#2a2018'; ctx.fillRect(x - 5, y + 25, 170, 30);
  ctx.fillStyle = '#5b8fd4'; ctx.fillRect(x, y + 28, 160, 25);
  ctx.fillStyle = '#7aa9e6'; ctx.fillRect(x, y + 28, 160, 7);
  ctx.fillStyle = '#4879b4'; ctx.fillRect(x, y + 47, 160, 6);
  // ピラミッド状に積み上げる
  const rows = [7, 6, 5, 4, 3, 2, 1];
  let placed = 0;
  for (let r = 0; r < rows.length && placed < n; r++) {
    const cnt = rows[r];
    for (let i = 0; i < cnt && placed < n; i++, placed++) {
      const jx = x + 6 + (7 - cnt) * 11 + i * 22;
      const jy = y + 22 - r * 12;
      ctx.save();
      ctx.translate(jx, jy);
      ctx.rotate((((placed * 37) % 24) - 12) / 36);
      drawJerky(-10, -7, 2.2);
      ctx.restore();
    }
  }
  // きらきら
  for (let i = 0; i < 6; i++) {
    const a = t * 0.05 + i * 1.1;
    ctx.fillStyle = 'rgba(255,236,150,' + (0.35 + Math.sin(a * 2) * 0.35) + ')';
    const sx = x + 80 + Math.cos(a) * 96, sy = y - 40 + Math.sin(a * 1.6) * 34;
    ctx.fillRect(sx - 6, sy - 1, 12, 3); ctx.fillRect(sx - 1, sy - 6, 3, 12);
  }
}

// --- カットシーン共通のランナー（オープニングとエンディングで使い回す）
let curScenes = STORY, sceneEnd = null;
function playScenes(scenes, onEnd) {
  curScenes = scenes; sceneEnd = onEnd;
  storyIdx = 0; storyTick = 0; state = 'story';
}
function startStory() { playScenes(STORY, () => { save.seenOpening = true; persist(); gotoSelect(); }); }
function startEnding() { playScenes(ENDING, () => { save.seenEnding = true; persist(); gotoSelect(); }); }
function endStory() { if (sceneEnd) sceneEnd(); }
function gotoSelect() { state = 'select'; selRow = 0; selCol = 0; }

// タイトル画面の「オープニングを見る」ボタン
const OPENING_BTN = { x: VW / 2 - 118, y: 398, w: 236, h: 32 };

// ================================================================= ループ
function loop() {
  tick++;

  if (state === 'title') {
    drawTitle();
    if (justPressed('KeyO')) startStory();
    else if (justPressed('Space', 'Enter', 'ArrowUp')) {
      // 初回はオープニングを見せる
      if (!save.seenOpening) startStory();
      else gotoSelect();
    }

  } else if (state === 'story') {
    storyTick++;
    drawStory();
    if (justPressed('Escape')) endStory();
    else if (justPressed('Space', 'Enter', 'ArrowUp')) {
      storyIdx++; storyTick = 0;
      if (storyIdx >= curScenes.length) endStory(); else SFX.jump();
    }

  } else if (state === 'select') {
    drawSelect();
    const maxRow = hiddenRowAvailable() ? 3 : 2;
    if (justPressed('ArrowLeft', 'KeyA'))  selCol = (selCol + 2) % 3;
    if (justPressed('ArrowRight', 'KeyD')) selCol = (selCol + 1) % 3;
    if (justPressed('ArrowUp', 'KeyW'))    selRow = (selRow + maxRow) % (maxRow + 1);
    if (justPressed('ArrowDown', 'KeyS'))  selRow = (selRow + 1) % (maxRow + 1);
    if (justPressed('Escape')) state = 'title';
    if (justPressed('KeyB')) state = 'badges';
    if (justPressed('Space', 'Enter')) launchSelected();

  } else if (state === 'badges') {
    drawBadges();
    if (justPressed('Escape', 'KeyB', 'Space', 'Enter')) state = 'select';

  } else if (state === 'play') {
    updatePlay();
    if (state === 'play') { drawWorld(); drawHUD(); }

  } else if (state === 'gameover') {
    drawWorld(); drawHUD();
    panel(['GAME OVER', 'ご主人はまだ待っている…', 'SCORE ' + score,
           K('Space でもう一度　／　Esc でステージ選択',
             'タップでもう一度　／　「もどる」でステージ選択')], '#ff7a8a');
    if (justPressed('Space', 'Enter')) {
      if (curStage.hidden) { loadStage(HIDDEN, -1); lives = 3; score = 0; state = 'play'; }
      else startStage(curIndex);
    }
    if (justPressed('Escape')) state = 'select';

  } else if (state === 'clear') {
    drawWorld(); drawHUD();
    const got = jerkies.filter(j => j.got).length;
    const bonus = lives * 500;
    const lines = [];
    if (curStage.hidden) {
      lines.push('ひみつ通路クリア！');
      lines.push('ジャーキー ' + got + ' / ' + stageJerky + ' 個');
    } else if (curStage.boss) {
      lines.push('ヒゲおやぶんを倒した！');
      lines.push('ジャーキー ' + got + ' / ' + stageJerky + ' 個　／　タイム ' + fmtTime(stageTimer));
    } else {
      lines.push('ステージクリア！');
      lines.push('ジャーキー ' + got + ' / ' + stageJerky + ' 個　／　タイム ' + fmtTime(stageTimer)
                 + (got === stageJerky ? '　★全取得！' : ''));
    }
    lines.push('SCORE ' + (score + bonus) + '（ライフボーナス +' + bonus + '）');
    const hasNext = !curStage.hidden && curIndex + 1 < TOTAL_STAGES;
    lines.push(hasNext ? K('Space でつぎのステージへ　／　Esc でステージ選択',
                           'タップでつぎのステージへ　／　「もどる」でステージ選択')
                       : K('Space でステージ選択へ', 'タップでステージ選択へ'));
    panel(lines, '#7fe08a');
    if (justPressed('Space', 'Enter')) {
      if (hasNext) startStage(curIndex + 1);
      else gotoSelect();
    }
    if (justPressed('Escape')) gotoSelect();
  }

  if (state === 'play' && justPressed('KeyR')) {
    if (curStage.hidden) { loadStage(HIDDEN, -1); lives = 3; score = 0; }
    else startStage(curIndex);
  }
  if (state === 'play' && justPressed('Escape')) { state = 'select'; }

  for (const k in pressed) pressed[k] = false;
  requestAnimationFrame(loop);
}

loadStage(stageAt(0), 0);
lives = 3; score = 0;
state = 'title';
loop();
